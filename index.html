$('#pk').innerHTML=`<div class=bx><b>انتخاب تاریخ شمسی</b><div class=df3><select id=py>${o([...Array(40)].map((_,i)=>[y0-30+i,fa(y0-30+i)]),c[0])}</select><select id=pm>${o(MN.map((n,i)=>[i+1,n]),c[1])}</select><select id=pd>${o([...Array(31)].map((_,i)=>[i+1,fa(i+1)]),c[2])}</select></div><p><button class=p onclick="$('#${id}').value=fa(jf([+$('#py').value,+$('#pm').value,+$('#pd').value]));$('#pk').classList.remove('on')">تایید</button> <button class=s onclick="$('#pk').classList.remove('on')">انصراف</button> <button class=s onclick="$('#${id}').value=fa(TJ);$('#pk').classList.remove('on')">امروز</button></p></div>`;$('#pk').classList.add('on')}

function img(i,id){const f=i.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);IM[id]=c.toDataURL('image/jpeg',.7);$('#'+id+'_p').src=IM[id]};im.src=rd.result};rd.readAsDataURL(f)}
